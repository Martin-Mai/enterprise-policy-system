# 这个文件告诉 Nginx：如何托管前端静态页面，并把 /api 请求转发给后端容器

server {
    listen 80;
    server_name localhost;

    # 前端静态资源根目录（Vue 编译产物）
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 模式：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 把所有 /api 开头的请求反向代理到 backend 容器（Docker 网络内服务名）
    location /api/ {
        proxy_pass http://backend:8000;

        # ---------- SSE（流式问答）专用配置 ----------
        # 关闭缓冲，让 token 实时推送到浏览器，而不是等整段响应攒完再发
        proxy_buffering off;
        proxy_cache off;

        # 使用 HTTP/1.1 并开启分块传输，支持长连接流式响应
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;

        # 大模型生成可能较慢，读写超时设为 300 秒
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 传递真实客户端信息给后端
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
